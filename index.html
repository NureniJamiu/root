<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Root · Turn messy research into a clear first draft.</title>
  <meta name="description"
    content="Root is a canvas for students, researchers and writers. Lay out your question, findings and sources as connected cards, then write it up beside the map. Free to start." />
  <meta property="og:title" content="Root · Turn messy research into a clear first draft." />
  <meta property="og:description"
    content="Root is a canvas for students, researchers and writers. Lay out your question, findings and sources as connected cards, then write it up beside the map. Free to start." />
  <meta property="og:type" content="website" />
  <script>
    // Apply the saved light/dark choice before first paint (see src/theme/theme.ts).
    (function () {
      try {
        var pref = localStorage.getItem('root.theme');
        var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) { }
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/src/public/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,300..800;1,300..800&family=JetBrains+Mono:ital,wght@0,400..700;1,400..700&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
