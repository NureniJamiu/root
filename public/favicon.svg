<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-label="Root">
  <defs>
    <linearGradient id="infGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#de5052" />
      <stop offset="100%" stop-color="#0051c3" />
    </linearGradient>
  </defs>

  <!-- White background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Double O ("oo") smiley face -->
  <!-- infinity replacing "oo" -->
  <path
    d="M 60 51.5 C 60 31.5 102 31.5 102 51.5 C 102 71.5 60 71.5 60 51.5 C 60 31.5 18 31.5 18 51.5 C 18 71.5 60 71.5 60 51.5"
    stroke="url(#infGrad)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" fill="none"
  />

  <!-- Mouth -->
  <path d="M 42 77.5 Q 60 91.5 78 77.5" stroke="#0051c3" stroke-width="5.5" stroke-linecap="round" fill="none" />

  <!-- Left pupil -->
  <circle cx="44" cy="50.5" r="5" fill="#0f172a" />
  <circle cx="46" cy="49.5" r="1.8" fill="white" />

  <!-- Right pupil -->
  <circle cx="76" cy="50.5" r="5" fill="#0f172a" />
  <circle cx="74" cy="49.5" r="1.8" fill="white" />
</svg>
