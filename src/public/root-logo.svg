<svg
        viewBox="0 0 206 96"
        xmlns="http://www.w3.org/2000/svg"
        style={{ width: "min(560px, 80vw)", height: "auto" }}
        aria-label="Root"
      >
        <defs>
          <linearGradient id="infGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stopColor="#de5052" />
            <stop offset="100%" stopColor="#0051c3" />
          </linearGradient>
        </defs>

        {/* R — capital, geometric stroke */}
        <g
          stroke="#0051c3"
          strokeWidth="7.5"
          strokeLinecap="round"
          strokeLinejoin="round"
          fill="none"
        >
          {/* Stem */}
          <line x1="16" y1="10" x2="16" y2="78" />
          {/* Bowl — D-curve from top to mid-stem */}
          <path d="M 16 10 C 56 10 56 50 16 50" />
          {/* Diagonal leg from bowl junction */}
          <line x1="44" y1="50" x2="70" y2="78" />
        </g>

        {/* ∞ — infinity replacing "oo", red→blue gradient */}
        <path
          d="M 98 44
             C 98 24 140 24 140 44
             C 140 64 98 64 98 44
             C 98 24 56 24 56 44
             C 56 64 98 64 98 44"
          stroke="url(#infGrad)"
          strokeWidth="7.5"
          strokeLinecap="round"
          strokeLinejoin="round"
          fill="none"
        />

        {/* Mouth — smile arc below the loops */}
        <path
          d="M 80 70 Q 98 84 116 70"
          stroke="#0051c3"
          strokeWidth="5.5"
          strokeLinecap="round"
          fill="none"
        />

        {/* Pupils — cross-eyed for comic effect */}
        {/* Left eye looking right (inward) */}
        <circle cx="82" cy="43" r="5" fill="#0f172a" />
        <circle cx="84" cy="42" r="1.8" fill="white" />
        {/* Right eye looking left (inward) */}
        <circle cx="114" cy="43" r="5" fill="#0f172a" />
        <circle cx="112" cy="42" r="1.8" fill="white" />

        {/* t — lowercase, matching stem weight */}
        <g
          stroke="#0051c3"
          strokeWidth="7.5"
          strokeLinecap="round"
          fill="none"
        >
          {/* Stem */}
          <line x1="164" y1="10" x2="164" y2="78" />
          {/* Crossbar at x-height */}
          <line x1="146" y1="36" x2="182" y2="36" />
        </g>
      </svg>